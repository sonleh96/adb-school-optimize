name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run analyze
        env:
          NEXT_PUBLIC_WRITE_OPERATIONS_ENABLED: "true"
      - run: npm run bundle:check

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-analysis
          path: |
            apps/web/.next/analyze/
            apps/web/.next/bundle-budget.json

  browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/

  lighthouse:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci
      - run: npm run lighthouse

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: apps/web/.lighthouseci/reports/

  api:
    runs-on: ubuntu-latest
    services:
      # Close to Supabase's Postgres 15 with PostGIS 3.3. The screening database tests create their own databases here.
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_PASSWORD: ci-throwaway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:ci-throwaway@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5

      - name: Install ruff
        run: uv tool install ruff

      - name: Ruff lint
        run: ruff check services/api packages/school_scoring

      - name: Ruff format check
        run: ruff format --check services/api packages/school_scoring

      - name: Install API + scoring package
        run: |
          uv pip install --system -e packages/school_scoring
          uv pip install --system --no-deps -e services/api
          uv pip install --system -r services/api/requirements.lock

      # Supabase provides these roles; a plain PostGIS server does not, and 002_security_lockdown.sql refers to them.
      - name: Apply database migrations
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "create role anon nologin" -c "create role authenticated nologin"
          for file in infra/sql/*.sql; do
            echo "applying $file"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$file"
          done

      - name: Migrations apply a second time without error
        run: |
          for file in infra/sql/*.sql; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$file"
          done

      - name: API tests
        working-directory: services/api
        run: python -m pytest tests/ -q -rs

      - name: Scoring package tests
        working-directory: packages/school_scoring
        run: python -m pytest tests/ -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f services/api/Dockerfile -t rise-png-api:ci .
